name: Temporary HUC execution

on:
  pull_request:
    branches: [master]
    paths:
      - chatgpt_tmp/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe official BIOSCAN URLs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          report=out/probe.txt
          : > "$report"
          urls=(
            "https://aspis.cmpt.sfu.ca/projects/bioscan/checkpoint/for_readme/ver_1_0/bioscan_5m/no_alignment/extracted_feature_from_test_split.hdf5"
            "https://aspis.cmpt.sfu.ca/projects/bioscan/checkpoint/for_readme/ver_1_0/bioscan_5m/image_dna/extracted_feature_from_test_split.hdf5"
            "https://aspis.cmpt.sfu.ca/projects/bioscan/checkpoint/for_readme/ver_1_0/bioscan_5m/image_dna_text/extracted_feature_from_test_split.hdf5"
            "https://aspis.cmpt.sfu.ca/projects/bioscan/checkpoint/for_readme/ver_1_0/no_alignment/extracted_feature_from_test_split.hdf5"
            "https://aspis.cmpt.sfu.ca/projects/bioscan/BIOSCAN_CLIP_for_downloading/INSECT_data/processed_data.zip"
          )
          for u in "${urls[@]}"; do
            echo "===== $u =====" | tee -a "$report"
            curl -L -sS -I --max-time 120 "$u" 2>&1 | tee -a "$report" || true
            rm -f /tmp/probe.bin
            curl -L -sS --max-time 120 -r 0-1048575 "$u" -o /tmp/probe.bin 2>&1 | tee -a "$report" || true
            echo "range_bytes=$(wc -c < /tmp/probe.bin 2>/dev/null || echo 0)" | tee -a "$report"
            file /tmp/probe.bin 2>&1 | tee -a "$report" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-huc-probe
          path: out
          retention-days: 1
