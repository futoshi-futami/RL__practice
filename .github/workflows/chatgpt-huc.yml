name: Complete iNaturalist HUC factorial execution

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/chatgpt-huc.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/inat-huc-complete-rerun
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pillow requests xgboost tabulate matplotlib openpyxl
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Assemble implementation and run tests
        shell: bash
        run: |
          set -euo pipefail
          cat runner/parts/part_*.txt > runner/experiment.py
          python -m py_compile runner/experiment.py
          python runner/experiment.py --output outputs/self_test --self-test-only

      - name: Run complete real-image numerical experiment
        id: experiment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/inat_compositions
          mkdir -p outputs/inat_compositions
          python runner/experiment.py \
            --output outputs/inat_compositions \
            --images-per-species 100 \
            --seeds 20260819 20260820 20260821 20260822 20260823 \
            --max-rounds 100 \
            --patience 12 \
            2>&1 | tee outputs/inat_compositions/console.log

      - name: Validate the complete table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('outputs/inat_compositions')
          status = json.loads((root / 'STATUS.json').read_text(encoding='utf-8'))
          results = pd.read_csv(root / 'results_all.csv')
          summary = pd.read_csv(root / 'summary.csv')
          metrics = ['MC','UC','C-UC','HUC','C-HUC','Brier','NLL','Accuracy','AUC']
          methods = {
              'Raw','Temperature','Dirichlet',
              'Raw→UC','Raw→C-HUC',
              'Temperature→UC','Temperature→C-HUC',
              'Dirichlet→UC','Dirichlet→C-HUC',
          }
          assert status['status'] == 'success', status
          assert len(results) == 270, len(results)
          assert set(results['method']) == methods, set(results['method'])
          assert results['seed'].nunique() == 5
          assert results['base_model'].nunique() == 6
          assert results[metrics].isna().sum().sum() == 0
          assert set(summary['method']) == methods
          validation = {
              'status': 'success',
              'rows': int(len(results)),
              'methods': sorted(methods),
              'seeds': sorted(int(x) for x in results['seed'].unique()),
              'base_models': sorted(results['base_model'].unique().tolist()),
              'maximum_decomposition_error': float(results['decomposition_error'].max()),
              'maximum_probability_sum_error': float(results['probability_sum_error'].max()),
              'minimum_probability': float(results['minimum_probability'].min()),
              'missing_core_values': int(results[metrics].isna().sum().sum()),
          }
          (root / 'COMPLETE_TABLE_VALIDATION.json').write_text(
              json.dumps(validation, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

      - name: Upload complete outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-inat-huc-factorial-results
          path: |
            outputs/inat_compositions
            outputs/self_test
            runner/experiment.py
          retention-days: 30
