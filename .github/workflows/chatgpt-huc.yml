name: Temporary HUC execution

on:
  pull_request:
    branches: [master]
    paths:
      - chatgpt_tmp/trigger.txt
      - .github/workflows/chatgpt-huc.yml
  push:
    branches: [master]
    paths: [.github/workflows/chatgpt-huc.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create probe artifact
        run: |
          mkdir -p out
          python - <<'PY'
          import json, platform
          json.dump({'status':'ok','python':platform.python_version()}, open('out/probe.json','w'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-huc-probe
          path: out
          retention-days: 1
