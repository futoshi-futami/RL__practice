name: Temporary HUC execution

on:
  pull_request:
    branches: [master]
    paths:
      - chatgpt_tmp/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download official BIOSCAN-1M embedding file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          url="https://aspis.cmpt.sfu.ca/projects/bioscan/checkpoint/for_readme/ver_1_0/no_alignment/extracted_feature_from_test_split.hdf5"
          curl -L --fail --retry 5 --retry-delay 5 --connect-timeout 30 "$url" -o work/bioscan_test.hdf5
          ls -lh work/bioscan_test.hdf5 | tee out/download.txt
          sha256sum work/bioscan_test.hdf5 >> out/download.txt
      - name: Inspect HDF5 recursively
        shell: bash
        run: |
          python - <<'PY'
          import h5py, json, os
          p='work/bioscan_test.hdf5'
          info={'path':p,'size_bytes':os.path.getsize(p),'objects':{}}
          with h5py.File(p,'r') as f:
              def visit(name,obj):
                  row={'type':'group' if isinstance(obj,h5py.Group) else 'dataset'}
                  if isinstance(obj,h5py.Dataset):
                      row.update(shape=list(obj.shape), dtype=str(obj.dtype), chunks=list(obj.chunks) if obj.chunks else None, compression=obj.compression)
                      if obj.ndim>=1 and obj.shape[0]>0:
                          try:
                              sample=obj[0]
                              if hasattr(sample,'tolist'): sample=sample.tolist()
                              if isinstance(sample,bytes): sample=sample.decode('utf-8','replace')
                              row['sample0']=str(sample)[:500]
                          except Exception as e: row['sample_error']=repr(e)
                  info['objects'][name]=row
              f.visititems(visit)
          json.dump(info,open('out/schema.json','w'),indent=2,ensure_ascii=False)
          print(json.dumps(info,indent=2,ensure_ascii=False)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-bioscan-schema
          path: out
          retention-days: 1
